
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>🌤️ Weather App</h1>
            <p>Discover the weather anywhere in the world</p>
        </header>

       
<div class="search-box">
    <input
        type="text"
        id="cityInput"
        placeholder="Enter city name..."
    >

    <button type="button" id="searchBtn">
        Search
    </button>
</div>

<div id="message"></div>

<div class="weather-card hidden" id="weatherCard">

    <div class="location">
        <h2 id="cityName"></h2>
        <p id="countryName"></p>
    </div>

    <div class="weather-main">
        <div id="weatherIcon" class="weather-icon">🌤️</div>
        <h1 id="temperature">--°C</h1>
        <p id="condition"></p>
    </div>

    <div class="weather-details">

        <div class="detail-box">
            <span>💧</span>
            <p>Humidity</p>
            <h3 id="humidity">--%</h3>
        </div>

        <div class="detail-box">
            <span>💨</span>
            <p>Wind Speed</p>
            <h3 id="windSpeed">-- km/h</h3>
        </div>

        <div class="detail-box">
            <span>🌡️</span>
            <p>Feels Like</p>
            <h3 id="feelsLike">--°C</h3>
        </div>

    </div>
</div>

<script src="script.js" defer></script>
</body>
</html>
